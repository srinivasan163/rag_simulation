<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0c0f0a;
    --surface: #141710;
    --surface2: #1c2018;
    --border: rgba(180,200,140,0.12);
    --border-strong: rgba(180,200,140,0.25);
    --text: #e8edd8;
    --muted: #7a8a60;
    --accent: #a8d060;
    --accent2: #60c8a0;
    --accent3: #e8a040;
    --accent4: #c070e0;
    --danger: #e05050;
    --font-head: 'Syne', sans-serif;
    --font-body: 'DM Sans', sans-serif;
    --font-mono: 'DM Mono', monospace;
    --r: 10px;
    --r-sm: 6px;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(168,208,96,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(168,208,96,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 860px;
    margin: 0 auto;
    padding: 0 24px;
    position: relative;
    z-index: 1;
  }

  /* ── HEADER ── */
  header {
    padding: 48px 0 32px;
    text-align: center;
  }

  .header-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(168,208,96,0.08);
    border: 1px solid rgba(168,208,96,0.2);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 11px;
    font-family: var(--font-mono);
    color: var(--accent);
    letter-spacing: 0.06em;
    margin-bottom: 20px;
  }

  .header-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(0.8)} }

  h1 {
    font-family: var(--font-head);
    font-size: clamp(32px, 5vw, 52px);
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -0.02em;
    color: var(--text);
    margin-bottom: 12px;
  }

  h1 span { color: var(--accent); }

  .header-sub {
    color: var(--muted);
    font-size: 15px;
    max-width: 500px;
    margin: 0 auto;
  }

  /* ── PHASE TABS ── */
  .phase-tabs {
    display: flex;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 5px;
    margin: 32px 0 24px;
  }

  .phase-tab {
    flex: 1;
    padding: 8px 12px;
    border-radius: 7px;
    font-family: var(--font-head);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-align: center;
    cursor: pointer;
    border: none;
    background: transparent;
    color: var(--muted);
    transition: all 0.2s;
  }

  .phase-tab:hover { color: var(--text); }
  .phase-tab.active-build { background: rgba(168,208,96,0.12); color: var(--accent); }
  .phase-tab.active-query { background: rgba(96,200,160,0.12); color: var(--accent2); }

  /* ── STEP PILLS ── */
  .step-pills {
    display: flex;
    gap: 4px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .step-pill {
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 11px;
    font-family: var(--font-mono);
    font-weight: 500;
    cursor: pointer;
    border: 1px solid var(--border);
    color: var(--muted);
    background: transparent;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .step-pill:hover { border-color: var(--border-strong); color: var(--text); }
  .step-pill.active { color: var(--bg); background: var(--accent); border-color: var(--accent); }
  .step-pill.done { border-color: var(--accent); color: var(--accent); opacity: 0.6; }
  .step-pill.active-query { background: var(--accent2); border-color: var(--accent2); color: var(--bg); }

  /* ── STAGE CARD ── */
  .stage-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r);
    overflow: hidden;
    margin-bottom: 16px;
    animation: slideIn 0.3s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .stage-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 20px;
    border-bottom: 1px solid var(--border);
  }

  .stage-num {
    width: 32px; height: 32px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 500;
    flex-shrink: 0;
  }

  .num-build { background: rgba(168,208,96,0.12); color: var(--accent); border: 1px solid rgba(168,208,96,0.3); }
  .num-query { background: rgba(96,200,160,0.12); color: var(--accent2); border: 1px solid rgba(96,200,160,0.3); }

  .stage-title-wrap { flex: 1; }
  .stage-title {
    font-family: var(--font-head);
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
  }

  .stage-phase {
    font-size: 10px;
    font-family: var(--font-mono);
    color: var(--muted);
    letter-spacing: 0.06em;
    margin-top: 2px;
  }

  .stage-body { padding: 20px; }

  .stage-desc {
    color: var(--muted);
    font-size: 13.5px;
    line-height: 1.7;
    margin-bottom: 18px;
  }

  .insight {
    background: rgba(168,208,96,0.05);
    border-left: 2px solid var(--accent);
    border-radius: 0 var(--r-sm) var(--r-sm) 0;
    padding: 10px 14px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.6;
    margin-top: 14px;
  }

  .insight-query {
    border-left-color: var(--accent2);
    background: rgba(96,200,160,0.05);
  }

  .insight strong { color: var(--text); font-weight: 500; }

  /* ── DOCUMENTS ── */
  .doc-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 8px;
    margin-bottom: 14px;
  }

  .doc-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    padding: 12px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .doc-card:hover { border-color: var(--border-strong); }
  .doc-card.selected { border-color: var(--accent); background: rgba(168,208,96,0.06); }

  .doc-icon { font-size: 22px; margin-bottom: 6px; }
  .doc-name { font-size: 12px; font-weight: 500; color: var(--text); }
  .doc-type {
    font-size: 10px;
    font-family: var(--font-mono);
    color: var(--muted);
    margin-top: 2px;
  }

  .doc-check {
    width: 14px; height: 14px;
    border-radius: 50%;
    border: 1px solid var(--border-strong);
    margin-top: 6px;
    transition: all 0.2s;
  }

  .doc-card.selected .doc-check {
    background: var(--accent);
    border-color: var(--accent);
    position: relative;
  }

  .doc-card.selected .doc-check::after {
    content: '✓';
    position: absolute;
    font-size: 8px;
    color: var(--bg);
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
  }

  /* ── CHUNKS ── */
  .chunk-container { display: flex; flex-direction: column; gap: 8px; }

  .chunk-row { display: flex; gap: 6px; }

  .chunk {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    padding: 8px 10px;
    font-size: 11px;
    font-family: var(--font-mono);
    color: var(--muted);
    line-height: 1.5;
    flex: 1;
    transition: all 0.3s;
    position: relative;
  }

  .chunk.highlighted {
    border-color: var(--accent);
    color: var(--text);
    background: rgba(168,208,96,0.05);
  }

  .chunk.overlap {
    border-style: dashed;
    border-color: var(--accent3);
    background: rgba(232,160,64,0.04);
  }

  .overlap-tag {
    position: absolute;
    top: -9px; right: 8px;
    font-size: 9px;
    padding: 1px 6px;
    border-radius: 4px;
    background: rgba(232,160,64,0.15);
    color: var(--accent3);
    border: 1px solid rgba(232,160,64,0.3);
    font-family: var(--font-mono);
  }

  .chunk-label {
    font-size: 9px;
    font-family: var(--font-mono);
    color: var(--muted);
    text-align: center;
    margin-top: 3px;
    opacity: 0.6;
  }

  /* ── VECTORS ── */
  .vector-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 8px;
  }

  .vector-chip {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    padding: 10px 8px;
    text-align: center;
    transition: all 0.4s;
  }

  .vector-chip.active {
    border-color: var(--accent4);
    background: rgba(192,112,224,0.06);
  }

  .vbars {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 2px;
    height: 32px;
    margin-bottom: 6px;
  }

  .vbar {
    width: 5px;
    border-radius: 2px 2px 0 0;
    background: var(--border-strong);
    transition: all 0.5s;
  }

  .vector-chip.active .vbar { background: var(--accent4); }

  .vchip-label {
    font-size: 9px;
    font-family: var(--font-mono);
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ── VECTOR DB ── */
  .vdb-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .vdb-cell {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    padding: 8px 6px;
    text-align: center;
    transition: all 0.3s;
  }

  .vdb-cell .dots {
    display: flex;
    justify-content: center;
    gap: 2px;
    margin-bottom: 5px;
  }

  .vdb-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--border-strong);
    transition: all 0.4s;
  }

  .vdb-cell.stored .vdb-dot { background: var(--accent4); }
  .vdb-cell.retrieved { border-color: var(--accent2); background: rgba(96,200,160,0.06); }
  .vdb-cell.retrieved .vdb-dot { background: var(--accent2); }
  .vdb-cell-label { font-size: 9px; font-family: var(--font-mono); color: var(--muted); }

  /* ── QUERY INPUT ── */
  .query-wrap {
    display: flex;
    gap: 8px;
    align-items: stretch;
    margin-bottom: 14px;
  }

  .query-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    padding: 10px 14px;
    font-size: 13px;
    font-family: var(--font-body);
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
  }

  .query-input:focus { border-color: var(--accent2); }
  .query-input::placeholder { color: var(--muted); }

  .btn {
    padding: 8px 18px;
    border-radius: var(--r-sm);
    font-size: 13px;
    font-family: var(--font-head);
    font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    transition: all 0.15s;
    white-space: nowrap;
  }

  .btn:hover { border-color: var(--border-strong); background: var(--surface2); }
  .btn:active { transform: scale(0.97); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .btn.primary:hover { opacity: 0.9; }
  .btn.primary-query { background: var(--accent2); border-color: var(--accent2); color: var(--bg); }
  .btn.primary-query:hover { opacity: 0.9; }

  /* ── TOP-K CONTROL ── */
  .topk-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    font-size: 12px;
    color: var(--muted);
  }

  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    width: 120px;
    height: 4px;
    background: var(--border-strong);
    border-radius: 2px;
    outline: none;
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent2);
    cursor: pointer;
    border: 2px solid var(--bg);
  }

  .topk-val {
    font-family: var(--font-mono);
    color: var(--accent2);
    font-weight: 500;
    min-width: 20px;
  }

  /* ── SEARCH RESULTS ── */
  .search-results { display: flex; flex-direction: column; gap: 6px; }

  .result-item {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 10px 12px;
    border-radius: var(--r-sm);
    border: 1px solid var(--border);
    background: var(--surface2);
    opacity: 0;
    transform: translateX(-8px);
    transition: all 0.3s;
  }

  .result-item.show { opacity: 1; transform: translateX(0); }
  .result-item.top-result { border-color: var(--accent2); background: rgba(96,200,160,0.05); }

  .result-rank {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    font-family: var(--font-mono);
    color: var(--muted);
    flex-shrink: 0;
    margin-top: 1px;
  }

  .top-result .result-rank { background: var(--accent2); color: var(--bg); border-color: var(--accent2); }

  .result-body { flex: 1; }
  .result-text { font-size: 12px; color: var(--text); line-height: 1.5; }
  .result-meta { display: flex; align-items: center; gap: 8px; margin-top: 5px; }

  .score-bar-bg {
    flex: 1; height: 3px;
    background: var(--border);
    border-radius: 2px;
    max-width: 100px;
  }

  .score-bar-fill {
    height: 100%;
    border-radius: 2px;
    background: var(--accent2);
    transition: width 0.6s ease;
  }

  .score-val {
    font-size: 10px;
    font-family: var(--font-mono);
    color: var(--muted);
  }

  .source-tag {
    font-size: 10px;
    font-family: var(--font-mono);
    padding: 1px 6px;
    border-radius: 4px;
    background: rgba(168,208,96,0.1);
    color: var(--accent);
    border: 1px solid rgba(168,208,96,0.2);
  }

  /* ── RERANK BADGE ── */
  .rerank-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-family: var(--font-mono);
    background: rgba(232,160,64,0.1);
    color: var(--accent3);
    border: 1px solid rgba(232,160,64,0.25);
    border-radius: var(--r-sm);
    padding: 4px 10px;
    margin-bottom: 10px;
  }

  /* ── PROMPT BUILDER ── */
  .prompt-builder { display: flex; flex-direction: column; gap: 6px; }

  .prompt-block {
    border-radius: var(--r-sm);
    padding: 10px 13px;
    font-size: 11.5px;
    font-family: var(--font-mono);
    line-height: 1.6;
    border: 1px solid;
  }

  .prompt-block .block-label {
    font-size: 9px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0.5;
    margin-bottom: 5px;
    font-weight: 500;
  }

  .pb-instruction {
    background: rgba(192,112,224,0.06);
    border-color: rgba(192,112,224,0.25);
    color: #d4a0f0;
  }

  .pb-context {
    background: rgba(96,200,160,0.06);
    border-color: rgba(96,200,160,0.25);
    color: var(--accent2);
  }

  .pb-query {
    background: rgba(168,208,96,0.06);
    border-color: rgba(168,208,96,0.25);
    color: var(--accent);
  }

  /* ── RESPONSE ── */
  .response-box {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    padding: 14px;
    font-size: 13px;
    line-height: 1.75;
    color: var(--text);
    min-height: 70px;
  }

  .cursor {
    display: inline-block;
    width: 2px; height: 14px;
    background: var(--accent2);
    margin-left: 2px;
    vertical-align: middle;
    animation: blink 0.75s step-end infinite;
  }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  /* ── NAV ── */
  .nav-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 0 40px;
    gap: 12px;
  }

  .nav-dots { display: flex; gap: 6px; }

  .nav-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--border-strong);
    transition: all 0.2s;
    cursor: pointer;
  }

  .nav-dot.active { background: var(--accent); width: 20px; border-radius: 4px; }
  .nav-dot.done { background: var(--accent); opacity: 0.4; }
  .nav-dot.active-query { background: var(--accent2); width: 20px; border-radius: 4px; }

  /* ── SECTION DIVIDER ── */
  .divider {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    font-size: 11px;
    font-family: var(--font-mono);
    letter-spacing: 0.06em;
    margin: 20px 0 14px;
  }

  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ── EMBED QUERY VIZ ── */
  .query-embed-viz {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    background: var(--surface2);
    border: 1px dashed var(--border-strong);
    border-radius: var(--r-sm);
    margin-top: 10px;
  }

  .query-text-chip {
    background: rgba(168,208,96,0.1);
    border: 1px solid rgba(168,208,96,0.2);
    border-radius: var(--r-sm);
    padding: 6px 10px;
    font-size: 12px;
    color: var(--accent);
    font-family: var(--font-mono);
    flex-shrink: 0;
  }

  .arrow-label {
    font-size: 10px;
    font-family: var(--font-mono);
    color: var(--muted);
    text-align: center;
  }

  .arrow-svg { color: var(--muted); }

  .embed-vector-preview {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 28px;
  }

  .evbar {
    width: 4px;
    border-radius: 2px 2px 0 0;
    background: var(--accent4);
    transition: height 0.5s ease;
  }

  /* ── MULTIMODAL NOTE ── */
  .multimodal-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-top: 10px;
  }

  .mm-chip {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    padding: 8px 10px;
    font-size: 11px;
    text-align: center;
  }

  .mm-chip .mm-icon { font-size: 18px; margin-bottom: 4px; }
  .mm-chip .mm-label { font-family: var(--font-mono); color: var(--muted); font-size: 10px; }
  .mm-chip.mm-special { border-color: rgba(232,160,64,0.3); background: rgba(232,160,64,0.05); }
  .mm-chip.mm-special .mm-label { color: var(--accent3); }

  /* ── COMPLETION SCREEN ── */
  .completion-card {
    background: var(--surface);
    border: 1px solid rgba(168,208,96,0.2);
    border-radius: var(--r);
    padding: 32px;
    text-align: center;
    animation: slideIn 0.4s ease;
  }

  .completion-icon { font-size: 40px; margin-bottom: 14px; }
  .completion-title {
    font-family: var(--font-head);
    font-size: 22px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 8px;
  }

  .completion-text {
    color: var(--muted);
    font-size: 13px;
    max-width: 400px;
    margin: 0 auto 20px;
    line-height: 1.7;
  }

  .summary-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 20px;
    text-align: left;
  }

  .summary-item {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    padding: 10px 12px;
  }

  .summary-term {
    font-size: 10px;
    font-family: var(--font-mono);
    color: var(--muted);
    letter-spacing: 0.06em;
    margin-bottom: 2px;
  }

  .summary-def {
    font-size: 12px;
    color: var(--text);
    line-height: 1.5;
  }

  .highlight { color: var(--accent); font-weight: 500; }
  .highlight-q { color: var(--accent2); font-weight: 500; }
  .highlight-o { color: var(--accent3); font-weight: 500; }
  .highlight-p { color: var(--accent4); font-weight: 500; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="header-badge">
      <div class="header-dot"></div>
      INTERACTIVE LEARNING TOOL
    </div>
    <h1>RAG <span>Simulator</span></h1>
    <p class="header-sub">Step through every stage of Retrieval-Augmented Generation — from document ingestion to final LLM response.</p>
  </header>

  <div class="phase-tabs">
    <button class="phase-tab" id="tab-build" onclick="goToPhase(0)">⬡ Build Knowledge Base</button>
    <button class="phase-tab" id="tab-query" onclick="goToPhase(4)">◈ User Query Flow</button>
  </div>

  <div class="step-pills" id="step-pills"></div>

  <div id="stage-content"></div>

  <div class="nav-bar">
    <button class="btn" id="btn-prev" onclick="navigate(-1)">← Back</button>
    <div class="nav-dots" id="nav-dots"></div>
    <button class="btn" id="btn-next" onclick="navigate(1)">Next →</button>
  </div>
</div>

<script>
// ─── DATA ───────────────────────────────────────────────────
const DOCS = [
  { icon: '📄', name: 'Product Manual', type: 'PDF', id: 'manual' },
  { icon: '📊', name: 'Q3 Report', type: 'XLSX', id: 'report' },
  { icon: '💬', name: 'Support Tickets', type: 'CSV', id: 'support' },
  { icon: '📝', name: 'Engineering Docs', type: 'MD', id: 'eng' },
  { icon: '🖼️', name: 'Product Images', type: 'IMG', id: 'img' },
  { icon: '🔊', name: 'Call Recordings', type: 'AUDIO', id: 'audio' },
];

const CHUNKS_DATA = [
  { id:'c1', text:'"The product supports up to 10 concurrent users in the standard tier."', overlap: false },
  { id:'c2', text:'"...in the standard tier. Enterprise plans allow unlimited users with dedicated infrastructure."', overlap: true },
  { id:'c3', text:'"Enterprise plans allow unlimited users with dedicated infrastructure and SLA guarantees."', overlap: false },
  { id:'c4', text:'"...SLA guarantees. Setup time averages 2-3 business days for onboarding."', overlap: true },
  { id:'c5', text:'"Setup time averages 2-3 business days for new onboarding requests."', overlap: false },
  { id:'c6', text:'"Pricing starts at $49/mo for the starter plan with basic analytics included."', overlap: false },
];

const VECTOR_LABELS = ['c1','c2','c3','c4','c5','c6','c7','c8','c9','c10','c11','c12'];

const VDB_LABELS = [
  'doc:c1','doc:c2','doc:c3','doc:c4','doc:c5','doc:c6',
  'doc:c7','doc:c8','doc:c9','doc:c10','doc:c11','doc:c12',
  'doc:c13','doc:c14','doc:c15','doc:c16','doc:c17','doc:c18',
  'doc:c19','doc:c20'
];

const SEARCH_RESULTS = [
  { text: '"Enterprise plans allow unlimited users with dedicated infrastructure and SLA guarantees."', score: 0.94, source: 'Product Manual', top: true },
  { text: '"Setup time averages 2-3 business days for new onboarding requests."', score: 0.87, source: 'Product Manual', top: true },
  { text: '"The product supports up to 10 concurrent users in the standard tier."', score: 0.81, source: 'Product Manual', top: false },
  { text: '"Enterprise dashboard includes user management, billing controls, and audit logs."', score: 0.72, source: 'Engineering Docs', top: false },
  { text: '"All plans include 99.9% uptime SLA and 24/7 priority support access."', score: 0.65, source: 'Q3 Report', top: false },
];

const SAMPLE_QUERIES = [
  'How many users can use the enterprise plan?',
  'What is the setup time for new accounts?',
  'What features are included in the starter plan?',
];

let state = {
  step: 0,
  selectedDocs: new Set(['manual','report','support']),
  query: SAMPLE_QUERIES[0],
  topK: 3,
  chunksHighlighted: false,
  vectorsActive: false,
  dbStored: false,
  searchDone: false,
  rerankDone: false,
  promptBuilt: false,
  responseTyped: false,
};

const STEPS = [
  { label: '01 Upload', phase: 'build' },
  { label: '02 Chunk', phase: 'build' },
  { label: '03 Embed', phase: 'build' },
  { label: '04 Store', phase: 'build' },
  { label: '05 Query', phase: 'query' },
  { label: '06 Search', phase: 'query' },
  { label: '07 Rerank', phase: 'query' },
  { label: '08 Prompt', phase: 'query' },
  { label: '09 Response', phase: 'query' },
];

// ─── RENDER HELPERS ──────────────────────────────────────────
function isQuery(step) { return step >= 4; }

function barHeights() {
  return Array.from({length:8}, () => Math.floor(Math.random()*80+10));
}

// ─── STAGE RENDERERS ─────────────────────────────────────────
function renderUpload() {
  const docCards = DOCS.map(d => `
    <div class="doc-card ${state.selectedDocs.has(d.id)?'selected':''}" onclick="toggleDoc('${d.id}')">
      <div class="doc-icon">${d.icon}</div>
      <div class="doc-name">${d.name}</div>
      <div class="doc-type">${d.type}</div>
      <div class="doc-check"></div>
    </div>
  `).join('');

  return `
    <div class="stage-card">
      <div class="stage-header">
        <div class="stage-num num-build">01</div>
        <div class="stage-title-wrap">
          <div class="stage-title">Upload documents</div>
          <div class="stage-phase">PHASE 1 · BUILD KNOWLEDGE BASE</div>
        </div>
      </div>
      <div class="stage-body">
        <p class="stage-desc">Gather all your content — PDFs, spreadsheets, images, audio files — into a central knowledge base. Click to select which documents to include.</p>
        <div class="doc-grid">${docCards}</div>
        <div style="font-size:12px;color:var(--muted);font-family:var(--font-mono);">${state.selectedDocs.size} document${state.selectedDocs.size!==1?'s':''} selected</div>
        <div class="insight">
          <strong>Key insight:</strong> RAG doesn't care about the format — it's all converted into a common representation. Images and audio require extra preprocessing steps (captioning, transcription) before they can be embedded.
        </div>
      </div>
    </div>`;
}

function renderChunk() {
  const chunkHTML = CHUNKS_DATA.map(c => `
    <div style="position:relative;">
      ${c.overlap ? '<span class="overlap-tag">overlap</span>' : ''}
      <div class="chunk ${c.overlap?'overlap':'highlighted'}">${c.text}</div>
      <div class="chunk-label">${c.id}</div>
    </div>
  `).join('');

  return `
    <div class="stage-card">
      <div class="stage-header">
        <div class="stage-num num-build">02</div>
        <div class="stage-title-wrap">
          <div class="stage-title">Break into chunks</div>
          <div class="stage-phase">PHASE 1 · BUILD KNOWLEDGE BASE</div>
        </div>
      </div>
      <div class="stage-body">
        <p class="stage-desc">Documents are split into smaller, searchable units called <strong style="color:var(--text)">chunks</strong>. Dashed-border chunks show the overlap region — a deliberate repetition of text that ensures meaning isn't lost at chunk boundaries.</p>
        <div class="chunk-container">${chunkHTML}</div>
        <div class="divider">chunk sizing strategy</div>
        <div class="multimodal-row">
          <div class="mm-chip">
            <div class="mm-icon">📝</div>
            <div class="mm-label">Text → paragraphs</div>
          </div>
          <div class="mm-chip">
            <div class="mm-icon">💻</div>
            <div class="mm-label">Code → functions</div>
          </div>
          <div class="mm-chip mm-special">
            <div class="mm-icon">🖼️</div>
            <div class="mm-label">Images → caption first</div>
          </div>
        </div>
        <div class="insight">
          <strong>Overlap:</strong> chunks share ~10–20% of their text with neighbors. This prevents a key sentence from being split across two chunks and losing its context. The overlap amount is a tunable design parameter.
        </div>
      </div>
    </div>`;
}

function renderEmbed() {
  const heights = [60,45,80,30,70,50,90,40,65,75,35,55,80,45,60,70];
  const chips = VECTOR_LABELS.map((lbl, i) => `
    <div class="vector-chip ${state.vectorsActive?'active':''}" id="vc-${i}">
      <div class="vbars">
        ${Array.from({length:6},(_,j)=>`<div class="vbar" style="height:${heights[(i*6+j)%heights.length]}%"></div>`).join('')}
      </div>
      <div class="vchip-label">${lbl}</div>
    </div>
  `).join('');

  return `
    <div class="stage-card">
      <div class="stage-header">
        <div class="stage-num num-build">03</div>
        <div class="stage-title-wrap">
          <div class="stage-title">Convert to vector embeddings</div>
          <div class="stage-phase">PHASE 1 · BUILD KNOWLEDGE BASE</div>
        </div>
      </div>
      <div class="stage-body">
        <p class="stage-desc">Each chunk is passed through an <strong style="color:var(--text)">embedding model</strong> (e.g. OpenAI text-embedding-3, Google's Gecko) which converts text into a list of hundreds of numbers — a vector. Similar meanings produce similar vectors.</p>
        <div style="margin-bottom:12px;">
          <button class="btn primary" onclick="activateVectors()">⚡ Run embedding model</button>
        </div>
        <div class="vector-grid" id="vector-grid">${chips}</div>
        <div class="divider">multimodal embeddings</div>
        <div class="multimodal-row">
          <div class="mm-chip">
            <div class="mm-icon">🔤</div>
            <div class="mm-label">Text → text model</div>
          </div>
          <div class="mm-chip mm-special">
            <div class="mm-icon">🖼️</div>
            <div class="mm-label">Images → CLIP / multimodal</div>
          </div>
          <div class="mm-chip mm-special">
            <div class="mm-icon">🎙️</div>
            <div class="mm-label">Audio → transcribe first</div>
          </div>
        </div>
        <div class="insight">
          <strong>What is an embedding?</strong> A list of ~1536 numbers that encodes <em>meaning</em>. "Dog" and "puppy" produce vectors that are geometrically close. This is what enables semantic search — finding meaning, not just keywords.
        </div>
      </div>
    </div>`;
}

function renderStore() {
  const cells = VDB_LABELS.map((lbl, i) => `
    <div class="vdb-cell ${state.dbStored?'stored':''} ${state.dbStored && i<3 ? 'retrieved':''}" id="cell-${i}">
      <div class="dots">
        ${Array.from({length:4},()=>`<div class="vdb-dot"></div>`).join('')}
      </div>
      <div class="vdb-cell-label">${lbl}</div>
    </div>
  `).join('');

  return `
    <div class="stage-card">
      <div class="stage-header">
        <div class="stage-num num-build">04</div>
        <div class="stage-title-wrap">
          <div class="stage-title">Store in vector database</div>
          <div class="stage-phase">PHASE 1 · BUILD KNOWLEDGE BASE</div>
        </div>
      </div>
      <div class="stage-body">
        <p class="stage-desc">Vectors are saved in a <strong style="color:var(--text)">vector database</strong> — a system optimized not for rows and SQL queries, but for <em>geometric similarity search</em>. It can find the nearest neighbors to any query vector in milliseconds.</p>
        <div style="margin-bottom:12px;">
          <button class="btn primary" onclick="storeVectors()">💾 Store all vectors</button>
        </div>
        <div class="vdb-grid" id="vdb-grid">${cells}</div>
        <div class="divider">popular providers</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          ${['Pinecone','Supabase pgvector','Weaviate','Qdrant','Chroma'].map(p=>`<span style="font-size:11px;font-family:var(--font-mono);padding:3px 9px;border-radius:4px;border:1px solid var(--border);color:var(--muted);">${p}</span>`).join('')}
        </div>
        <div class="insight">
          <strong>Why not a regular database?</strong> Postgres or MySQL can store data but can't efficiently run "find me the 5 most similar vectors." Vector databases are built on ANN algorithms (HNSW, IVFFlat) that make this search blazing fast — even across millions of vectors.
        </div>
      </div>
    </div>`;
}

function renderQueryInput() {
  const queryOptions = SAMPLE_QUERIES.map(q => `
    <button class="btn" style="font-size:12px;text-align:left;padding:6px 12px;" onclick="setQuery('${q.replace(/'/g,"\\'")}')">
      ${q}
    </button>
  `).join('');

  const evHeights = Array.from({length:14}, () => Math.floor(Math.random()*80+10));
  const evBars = evHeights.map(h => `<div class="evbar" style="height:${h}%"></div>`).join('');

  return `
    <div class="stage-card">
      <div class="stage-header">
        <div class="stage-num num-query">05</div>
        <div class="stage-title-wrap">
          <div class="stage-title">User enters a query</div>
          <div class="stage-phase">PHASE 2 · USER QUERY FLOW</div>
        </div>
      </div>
      <div class="stage-body">
        <p class="stage-desc">The user types a question. Before it reaches the knowledge base, it must be <strong style="color:var(--text)">converted to a vector embedding</strong> using the exact same model that was used to embed the documents. This puts query and documents in the same mathematical space.</p>
        <div class="query-wrap">
          <input class="query-input" id="query-field" type="text" value="${state.query}" oninput="state.query=this.value" placeholder="Type a question...">
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;">${queryOptions}</div>
        <div class="query-embed-viz">
          <div class="query-text-chip" id="query-chip">"${state.query.slice(0,35)}${state.query.length>35?'...':''}"</div>
          <div>
            <div class="arrow-label">embedding<br>model</div>
            <svg width="30" height="14" viewBox="0 0 30 14" fill="none"><path d="M2 7h22M20 3l6 4-6 4" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div>
            <div class="embed-vector-preview">${evBars}</div>
            <div style="font-size:9px;font-family:var(--font-mono);color:var(--accent4);margin-top:3px;">query vector [0.23, -0.81, ...]</div>
          </div>
        </div>
        <div class="insight insight-query">
          <strong>Key insight:</strong> Using the <em>same model</em> for both documents and queries is non-negotiable. Different models produce incompatible vector spaces — your cosine similarity scores would be meaningless.
        </div>
      </div>
    </div>`;
}

function renderSearch() {
  const topK = state.topK;
  const resultsHTML = SEARCH_RESULTS.slice(0, Math.max(5, topK+1)).map((r, i) => `
    <div class="result-item ${i < topK ? 'top-result' : ''}" id="res-${i}" style="transition-delay:${i*0.1}s">
      <div class="result-rank">${i+1}</div>
      <div class="result-body">
        <div class="result-text">${r.text}</div>
        <div class="result-meta">
          <div class="score-bar-bg">
            <div class="score-bar-fill" style="width:${state.searchDone ? r.score*100 : 0}%"></div>
          </div>
          <div class="score-val">${r.score.toFixed(2)} sim</div>
          <div class="source-tag">${r.source}</div>
        </div>
      </div>
    </div>
  `).join('');

  return `
    <div class="stage-card">
      <div class="stage-header">
        <div class="stage-num num-query">06</div>
        <div class="stage-title-wrap">
          <div class="stage-title">Semantic search (top-k retrieval)</div>
          <div class="stage-phase">PHASE 2 · USER QUERY FLOW</div>
        </div>
      </div>
      <div class="stage-body">
        <p class="stage-desc">The query vector is compared against every stored chunk vector using <strong style="color:var(--text)">cosine similarity</strong>. The <span class="highlight-q">top-k</span> most similar chunks are retrieved. k is a parameter you control.</p>
        <div class="topk-row">
          <span>top-k:</span>
          <input type="range" min="1" max="5" value="${topK}" oninput="state.topK=parseInt(this.value);document.getElementById('topk-val').textContent=this.value;renderCurrentStage()">
          <span class="topk-val" id="topk-val">${topK}</span>
          <span style="margin-left:8px;">chunks retrieved</span>
        </div>
        <button class="btn primary-query" style="margin-bottom:12px;" onclick="runSearch()">🔍 Run semantic search</button>
        <div class="search-results" id="search-results">${resultsHTML}</div>
        <div class="insight insight-query">
          <strong>Cosine similarity</strong> measures the angle between two vectors. A score of 1.0 = identical meaning, 0.0 = unrelated. The top-k results (shown in green) are what gets passed forward to the next stage.
        </div>
      </div>
    </div>`;
}

function renderRerank() {
  const topK = state.topK;
  const rerankResults = SEARCH_RESULTS.slice(0, topK).map((r,i) => ({
    ...r,
    originalRank: i+1,
    newRank: i===1?1:i===0?2:i+1,
    newScore: i===1?0.97:i===0?0.91:r.score-0.05
  })).sort((a,b)=>a.newRank-b.newRank);

  const resultsHTML = rerankResults.map((r,i) => `
    <div class="result-item top-result ${state.rerankDone?'show':''}" style="transition-delay:${i*0.12}s">
      <div class="result-rank">${r.newRank}</div>
      <div class="result-body">
        <div class="result-text">${r.text}</div>
        <div class="result-meta">
          <div class="score-bar-bg">
            <div class="score-bar-fill" style="width:${state.rerankDone?r.newScore*100:r.score*100}%"></div>
          </div>
          <div class="score-val">${state.rerankDone ? r.newScore.toFixed(2) : r.score.toFixed(2)} ${state.rerankDone?'rerank':'sim'}</div>
          <div class="source-tag">${r.source}</div>
          ${state.rerankDone && r.originalRank !== r.newRank ? `<span style="font-size:10px;font-family:var(--font-mono);color:var(--accent3);">↑ was #${r.originalRank}</span>` : ''}
        </div>
      </div>
    </div>
  `).join('');

  return `
    <div class="stage-card">
      <div class="stage-header">
        <div class="stage-num num-query">07</div>
        <div class="stage-title-wrap">
          <div class="stage-title">Re-ranking (optional)</div>
          <div class="stage-phase">PHASE 2 · USER QUERY FLOW</div>
        </div>
      </div>
      <div class="stage-body">
        <p class="stage-desc">A second, more precise model scores the retrieved chunks against the query for true relevance. This can reorder results that were geometrically close but not actually the best answer.</p>
        <button class="btn" style="margin-bottom:10px;" onclick="runRerank()">⚖️ Run re-ranker model</button>
        ${state.rerankDone ? '<div class="rerank-badge">✦ Re-ranked — order changed</div>' : ''}
        <div class="search-results" id="rerank-results">${resultsHTML}</div>
        <div class="insight insight-query">
          <strong>Why rerank?</strong> Embedding similarity is fast but approximate. A cross-encoder re-ranker reads the full query + chunk pair together (like an LLM would) and produces a more accurate relevance score. Adds latency, but dramatically improves quality in production.
        </div>
      </div>
    </div>`;
}

function renderPromptBuild() {
  const queryPreview = state.query.length > 60 ? state.query.slice(0,60)+'...' : state.query;
  const topK = state.topK;
  const contextChunks = SEARCH_RESULTS.slice(0, topK).map((r,i)=>`[${i+1}] ${r.text}`).join('\n');

  return `
    <div class="stage-card">
      <div class="stage-header">
        <div class="stage-num num-query">08</div>
        <div class="stage-title-wrap">
          <div class="stage-title">Build the prompt</div>
          <div class="stage-phase">PHASE 2 · USER QUERY FLOW</div>
        </div>
      </div>
      <div class="stage-body">
        <p class="stage-desc">The final prompt sent to the LLM is assembled from <strong style="color:var(--text)">three parts</strong>: a system instruction (defines behavior), the retrieved context (the evidence), and the user's original question.</p>
        <div class="prompt-builder">
          <div class="prompt-block pb-instruction">
            <div class="block-label">🟣 SYSTEM INSTRUCTION</div>
            You are a helpful assistant. Answer the user's question using ONLY the context provided below. If the answer is not in the context, say "I don't have that information." Do not make up facts.
          </div>
          <div class="prompt-block pb-context">
            <div class="block-label">🟢 RETRIEVED CONTEXT (top-${topK} chunks)</div>
            ${contextChunks}
          </div>
          <div class="prompt-block pb-query">
            <div class="block-label">🟡 USER QUERY</div>
            ${queryPreview}
          </div>
        </div>
        <div class="insight insight-query">
          <strong>"Only use the context provided"</strong> is the critical instruction. It prevents the LLM from hallucinating answers from its general training knowledge and forces it to stay grounded in your documents.
        </div>
      </div>
    </div>`;
}

function renderResponse() {
  const responses = {
    'How many users can use the enterprise plan?': 'Based on the provided documentation, the enterprise plan allows <strong style="color:var(--accent2)">unlimited users</strong> with dedicated infrastructure and SLA guarantees. This differs from the standard tier, which is capped at 10 concurrent users.',
    'What is the setup time for new accounts?': 'According to the product manual, <strong style="color:var(--accent2)">setup time averages 2–3 business days</strong> for new onboarding requests.',
    'What features are included in the starter plan?': 'Based on the retrieved context, the starter plan is priced at <strong style="color:var(--accent2)">$49/month</strong> and includes basic analytics. Additional features for higher tiers are not detailed in the provided context.',
  };

  const matched = Object.keys(responses).find(k => state.query.toLowerCase().includes(k.toLowerCase().split(' ')[3]));
  const responseText = matched ? responses[matched] : responses[SAMPLE_QUERIES[0]];

  return `
    <div class="stage-card">
      <div class="stage-header">
        <div class="stage-num num-query">09</div>
        <div class="stage-title-wrap">
          <div class="stage-title">LLM generates response</div>
          <div class="stage-phase">PHASE 2 · USER QUERY FLOW</div>
        </div>
      </div>
      <div class="stage-body">
        <p class="stage-desc">The complete prompt is sent to the LLM (GPT-4, Claude, Gemini…). It reads the instruction, the retrieved evidence, and the question — then generates an answer grounded <em>only</em> in what was retrieved.</p>
        <button class="btn primary-query" style="margin-bottom:12px;" onclick="typeResponse()">▶ Generate response</button>
        <div style="font-size:12px;color:var(--muted);font-family:var(--font-mono);margin-bottom:8px;">LLM output:</div>
        <div class="response-box" id="response-box">
          ${state.responseTyped ? responseText : '<span class="cursor"></span>'}
        </div>
        <div class="insight insight-query" style="margin-top:12px;">
          <strong>RAG vs fine-tuning:</strong> RAG doesn't change the LLM's weights — it just feeds it relevant information at inference time. This means you can update your knowledge base without retraining the model. That's a huge operational advantage.
        </div>
      </div>
    </div>
    ${state.responseTyped ? renderCompletion() : ''}`;
}

function renderCompletion() {
  return `
    <div class="completion-card">
      <div class="completion-icon">✦</div>
      <div class="completion-title">You've completed the full RAG pipeline.</div>
      <p class="completion-text">From raw documents to a grounded LLM response — you've seen every step of Retrieval-Augmented Generation in action.</p>
      <div class="summary-grid">
        <div class="summary-item">
          <div class="summary-term">TOP-K</div>
          <div class="summary-def">How many chunks to retrieve. Higher = more context but more noise.</div>
        </div>
        <div class="summary-item">
          <div class="summary-term">OVERLAP</div>
          <div class="summary-def">Shared text between adjacent chunks to preserve boundary context.</div>
        </div>
        <div class="summary-item">
          <div class="summary-term">EMBEDDING</div>
          <div class="summary-def">A numerical vector that encodes the semantic meaning of text.</div>
        </div>
        <div class="summary-item">
          <div class="summary-term">RE-RANKING</div>
          <div class="summary-def">A second model pass to improve retrieval precision post-search.</div>
        </div>
        <div class="summary-item">
          <div class="summary-term">VECTOR DB</div>
          <div class="summary-def">Database optimized for similarity search, not SQL queries.</div>
        </div>
        <div class="summary-item">
          <div class="summary-term">GROUNDING</div>
          <div class="summary-def">Forcing the LLM to answer only from provided context, not hallucinations.</div>
        </div>
      </div>
      <div style="margin-top:20px;">
        <button class="btn primary" onclick="restart()">↺ Start over</button>
      </div>
    </div>`;
}

// ─── STATE ACTIONS ───────────────────────────────────────────
function toggleDoc(id) {
  if (state.selectedDocs.has(id)) {
    if (state.selectedDocs.size > 1) state.selectedDocs.delete(id);
  } else {
    state.selectedDocs.add(id);
  }
  renderCurrentStage();
}

function activateVectors() {
  state.vectorsActive = true;
  renderCurrentStage();
  setTimeout(() => {
    document.querySelectorAll('.vector-chip').forEach((el,i) => {
      el.classList.add('active');
    });
  }, 50);
}

function storeVectors() {
  state.dbStored = true;
  renderCurrentStage();
  setTimeout(() => {
    document.querySelectorAll('.vdb-cell').forEach((el,i) => {
      setTimeout(()=>{ el.classList.add('stored'); }, i*30);
    });
  }, 50);
}

function setQuery(q) {
  state.query = q;
  const field = document.getElementById('query-field');
  if (field) field.value = q;
  const chip = document.getElementById('query-chip');
  if (chip) chip.textContent = `"${q.slice(0,35)}${q.length>35?'...':''}"`;
}

function runSearch() {
  state.searchDone = true;
  renderCurrentStage();
  setTimeout(() => {
    document.querySelectorAll('.result-item').forEach((el,i) => {
      setTimeout(()=>{ el.classList.add('show'); }, i*120);
    });
  }, 50);
}

function runRerank() {
  state.rerankDone = true;
  renderCurrentStage();
  setTimeout(() => {
    document.querySelectorAll('#rerank-results .result-item').forEach((el,i) => {
      setTimeout(()=>{ el.classList.add('show'); }, i*120);
    });
  }, 50);
}

let typeTimer = null;
function typeResponse() {
  const box = document.getElementById('response-box');
  if (!box) return;

  const responses = {
    'users': 'Based on the provided documentation, the enterprise plan allows <strong style="color:var(--accent2)">unlimited users</strong> with dedicated infrastructure and SLA guarantees. This differs from the standard tier, which is capped at 10 concurrent users.',
    'setup': 'According to the product manual, <strong style="color:var(--accent2)">setup time averages 2–3 business days</strong> for new onboarding requests.',
    'starter': 'Based on the retrieved context, the starter plan is priced at <strong style="color:var(--accent2)">$49/month</strong> and includes basic analytics. Additional features for higher tiers are not detailed in the provided context.',
  };

  const q = state.query.toLowerCase();
  let response = responses['users'];
  if (q.includes('setup') || q.includes('time') || q.includes('days')) response = responses['setup'];
  else if (q.includes('starter') || q.includes('features') || q.includes('pricing')) response = responses['starter'];

  box.innerHTML = '<span class="cursor"></span>';
  const plain = response.replace(/<[^>]+>/g, '');
  let i = 0;
  if (typeTimer) clearInterval(typeTimer);
  typeTimer = setInterval(() => {
    if (i >= plain.length) {
      clearInterval(typeTimer);
      box.innerHTML = response;
      state.responseTyped = true;
      const content = document.getElementById('stage-content');
      const completion = document.createElement('div');
      completion.innerHTML = renderCompletion();
      content.appendChild(completion.firstElementChild);
      return;
    }
    box.innerHTML = plain.slice(0,i+1) + '<span class="cursor"></span>';
    i += 2;
  }, 18);
}

function restart() {
  state = {
    step: 0,
    selectedDocs: new Set(['manual','report','support']),
    query: SAMPLE_QUERIES[0],
    topK: 3,
    chunksHighlighted: false,
    vectorsActive: false,
    dbStored: false,
    searchDone: false,
    rerankDone: false,
    promptBuilt: false,
    responseTyped: false,
  };
  renderAll();
}

// ─── NAVIGATION ──────────────────────────────────────────────
function navigate(dir) {
  const next = state.step + dir;
  if (next < 0 || next >= STEPS.length) return;
  state.step = next;
  renderAll();
}

function goToStep(s) {
  state.step = s;
  renderAll();
}

function goToPhase(s) {
  state.step = s;
  renderAll();
}

function renderCurrentStage() {
  const content = document.getElementById('stage-content');
  const renders = [
    renderUpload,
    renderChunk,
    renderEmbed,
    renderStore,
    renderQueryInput,
    renderSearch,
    renderRerank,
    renderPromptBuild,
    renderResponse,
  ];
  content.innerHTML = renders[state.step]();
}

function renderAll() {
  // Phase tabs
  const tabBuild = document.getElementById('tab-build');
  const tabQuery = document.getElementById('tab-query');
  tabBuild.className = 'phase-tab' + (state.step < 4 ? ' active-build' : '');
  tabQuery.className = 'phase-tab' + (state.step >= 4 ? ' active-query' : '');

  // Step pills
  const pills = document.getElementById('step-pills');
  pills.innerHTML = STEPS.map((s,i) => {
    let cls = 'step-pill';
    if (i === state.step) cls += s.phase === 'query' ? ' active-query' : ' active';
    else if (i < state.step) cls += ' done';
    return `<button class="${cls}" onclick="goToStep(${i})">${s.label}</button>`;
  }).join('');

  // Content
  renderCurrentStage();

  // Nav dots
  const dots = document.getElementById('nav-dots');
  dots.innerHTML = STEPS.map((_,i) => {
    let cls = 'nav-dot';
    if (i === state.step) cls += STEPS[i].phase === 'query' ? ' active-query' : ' active';
    else if (i < state.step) cls += ' done';
    return `<div class="${cls}" onclick="goToStep(${i})"></div>`;
  }).join('');

  // Buttons
  document.getElementById('btn-prev').disabled = state.step === 0;
  document.getElementById('btn-next').textContent = state.step === STEPS.length-1 ? 'Done ✓' : 'Next →';
  document.getElementById('btn-next').onclick = state.step === STEPS.length-1 ? restart : () => navigate(1);
}

// ─── INIT ────────────────────────────────────────────────────
renderAll();
</script>
</body>
</html>
