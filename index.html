<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG Simulator</title>
<style>
  body {
    font-family: Inter, sans-serif;
    margin: 0;
    background: #0f172a;
    color: #e2e8f0;
  }
  .container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
  }
  h1 {
    text-align: center;
    margin-bottom: 20px;
  }
  .card {
    background: #1e293b;
    padding: 16px;
    border-radius: 16px;
    margin-bottom: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  textarea, input {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: none;
    margin-top: 10px;
    background: #0f172a;
    color: white;
  }
  button {
    margin-top: 10px;
    padding: 10px 16px;
    border-radius: 10px;
    border: none;
    background: #38bdf8;
    color: black;
    cursor: pointer;
  }
  .chunks, .results {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 10px;
  }
  .chunk {
    background: #334155;
    padding: 10px;
    border-radius: 10px;
    font-size: 14px;
  }
  .highlight {
    border: 2px solid #38bdf8;
  }
</style>
</head>
<body>
<div class="container">
  <h1>RAG Simulator</h1>

  <div class="card">
    <h2>1. Upload Knowledge</h2>
    <textarea id="inputText" rows="4" placeholder="Paste your document here..."></textarea>
    <button onclick="chunkText()">Chunk Text</button>
    <div class="chunks" id="chunks"></div>
  </div>

  <div class="card">
    <h2>2. User Query</h2>
    <input id="query" placeholder="Ask a question..." />
    <button onclick="runRAG()">Run RAG</button>
  </div>

  <div class="card">
    <h2>3. Retrieved Chunks</h2>
    <div class="results" id="results"></div>
  </div>

  <div class="card">
    <h2>4. Final Answer</h2>
    <p id="answer"></p>
  </div>
</div>

<script>
let storedChunks = [];

function chunkText() {
  const text = document.getElementById("inputText").value;
  const chunkSize = 20;
  const words = text.split(" ");
  storedChunks = [];

  for (let i = 0; i < words.length; i += chunkSize) {
    const chunk = words.slice(i, i + chunkSize).join(" ");
    storedChunks.push(chunk);
  }

  const container = document.getElementById("chunks");
  container.innerHTML = "";

  storedChunks.forEach(c => {
    const div = document.createElement("div");
    div.className = "chunk";
    div.innerText = c;
    container.appendChild(div);
  });
}

function similarity(a, b) {
  const aWords = new Set(a.toLowerCase().split(" "));
  const bWords = new Set(b.toLowerCase().split(" "));
  let common = 0;

  aWords.forEach(word => {
    if (bWords.has(word)) common++;
  });

  return common / (aWords.size + bWords.size);
}

function runRAG() {
  const query = document.getElementById("query").value;

  const scored = storedChunks.map(chunk => {
    return {
      chunk,
      score: similarity(query, chunk)
    };
  });

  scored.sort((a, b) => b.score - a.score);
  const topChunks = scored.slice(0, 3);

  const resultDiv = document.getElementById("results");
  resultDiv.innerHTML = "";

  topChunks.forEach(c => {
    const div = document.createElement("div");
    div.className = "chunk highlight";
    div.innerText = c.chunk;
    resultDiv.appendChild(div);
  });

  // Simulated LLM answer
  const answer = "Based on retrieved info: " + topChunks.map(c => c.chunk).join(" ");
  document.getElementById("answer").innerText = answer;
}
</script>
</body>
</html>
