<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RAG Simulator</title>

<style>

*{
box-sizing:border-box;
}

body{
font-family: Inter, system-ui, -apple-system;
background:#0f172a;
color:white;
margin:0;
padding:40px;
}

h1{
text-align:center;
margin-bottom:10px;
}

.subtitle{
text-align:center;
color:#94a3b8;
margin-bottom:40px;
}

.container{
max-width:1200px;
margin:auto;
display:grid;
grid-template-columns:1fr 1fr;
gap:25px;
}

.card{
background:#1e293b;
border-radius:14px;
padding:20px;
box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

.card h2{
margin-top:0;
font-size:18px;
}

textarea,input{
width:100%;
background:#0f172a;
border:1px solid #334155;
border-radius:8px;
padding:10px;
color:white;
margin-top:10px;
}

button{
margin-top:10px;
background:#6366f1;
border:none;
padding:10px 16px;
border-radius:8px;
color:white;
cursor:pointer;
}

button:hover{
background:#818cf8;
}

.doc{
background:#0f172a;
padding:10px;
border-radius:8px;
margin-top:8px;
font-size:14px;
}

.pipeline{
grid-column:1 / span 2;
display:flex;
justify-content:space-between;
margin-top:20px;
flex-wrap:wrap;
}

.step{
background:#1e293b;
padding:14px;
border-radius:10px;
width:12%;
text-align:center;
font-size:13px;
}

.step.active{
border:2px solid #22c55e;
}

.arrow{
text-align:center;
font-size:22px;
color:#64748b;
margin:0 5px;
}

.answer{
grid-column:1 / span 2;
margin-top:20px;
}

pre{
white-space:pre-wrap;
font-size:13px;
background:#020617;
padding:12px;
border-radius:8px;
}

</style>
</head>

<body>

<h1>RAG Simulator</h1>
<p class="subtitle">Understand Retrieval Augmented Generation step-by-step</p>

<div class="container">

<div class="card">

<h2>Knowledge Base</h2>

<textarea id="docInput" rows="3" placeholder="Add document"></textarea>
<button onclick="addDoc()">Add Document</button>

<div id="docs"></div>

</div>

<div class="card">

<h2>User Query</h2>

<input id="queryInput" placeholder="Ask something...">

<button onclick="runRAG()">Run RAG</button>

<div id="queryDisplay"></div>

</div>

<div class="pipeline">

<div class="step" id="s1">Ingest</div>
<div class="arrow">→</div>
<div class="step" id="s2">Chunk</div>
<div class="arrow">→</div>
<div class="step" id="s3">Embed</div>
<div class="arrow">→</div>
<div class="step" id="s4">Store</div>
<div class="arrow">→</div>
<div class="step" id="s5">Query</div>
<div class="arrow">→</div>
<div class="step" id="s6">Retrieve</div>
<div class="arrow">→</div>
<div class="step" id="s7">Prompt</div>
<div class="arrow">→</div>
<div class="step" id="s8">Generate</div>

</div>

<div class="card answer">

<h2>LLM Output</h2>

<pre id="output">Run a query to see results</pre>

</div>

</div>

<script>

const vocabulary = [
"ai","model","data","bank","payment",
"fraud","machine","learning","book","audio"
]

let docs=[]

function embed(text){

let words=text.toLowerCase().split(/\W+/)

return vocabulary.map(v=>{
return words.filter(w=>w===v).length
})

}

function cosine(a,b){

let dot=0
let magA=0
let magB=0

for(let i=0;i<a.length;i++){
dot+=a[i]*b[i]
magA+=a[i]*a[i]
magB+=b[i]*b[i]
}

magA=Math.sqrt(magA)
magB=Math.sqrt(magB)

if(magA===0||magB===0) return 0

return dot/(magA*magB)

}

function addDoc(){

let text=document.getElementById("docInput").value
if(!text) return

docs.push({
text,
vector:embed(text)
})

document.getElementById("docInput").value=""

renderDocs()

highlight("s1")
}

function renderDocs(){

let el=document.getElementById("docs")
el.innerHTML=""

docs.forEach(d=>{
let div=document.createElement("div")
div.className="doc"
div.innerHTML=d.text
el.appendChild(div)
})

}

function highlight(id){

document.querySelectorAll(".step").forEach(s=>s.classList.remove("active"))
document.getElementById(id).classList.add("active")

}

function runRAG(){

let query=document.getElementById("queryInput").value

document.getElementById("queryDisplay").innerHTML="<p>"+query+"</p>"

highlight("s5")

let qVec=embed(query)

let scored=docs.map(d=>({
...d,
score:cosine(qVec,d.vector)
}))

scored.sort((a,b)=>b.score-a.score)

let top=scored.slice(0,2)

highlight("s6")

let context=top.map(t=>t.text).join("\n")

highlight("s7")

let prompt=`Use the context to answer the question.

Context:
${context}

Question:
${query}
`

highlight("s8")

let answer="Based on retrieved knowledge:\n\n"+context

document.getElementById("output").textContent=answer

}

</script>

</body>
</html>
